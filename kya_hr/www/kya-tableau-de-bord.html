<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau de Bord KYA-Energy Group</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* ─── Base ─────────────────────────────────────────────────────── */
:root {
  --kya-navy:   #1a1a2e;
  --kya-blue:   #0054a6;
  --kya-orange: #e07b00;
  --kya-green:  #2e7d32;
  --kya-red:    #c62828;
  --kya-purple: #6a1b9a;
  --kya-bg:     #f0f4f8;
  --radius:     10px;
}
body { background: var(--kya-bg); font-family: 'Segoe UI', sans-serif; margin: 0; color: var(--kya-navy); }

/* ─── Header ────────────────────────────────────────────────────── */
.kya-header {
  background: linear-gradient(135deg, var(--kya-navy) 0%, var(--kya-blue) 100%);
  color: #fff; padding: 20px 32px; display: flex; align-items: center; gap: 20px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  position: sticky; top: 0; z-index: 100;
}
.kya-header img { height: 52px; border-radius: 6px; }
.kya-header-title { flex: 1; }
.kya-header-title h1 { margin: 0; font-size: 1.4rem; font-weight: 700; }
.kya-header-title p  { margin: 0; font-size: 0.8rem; opacity: 0.8; }
.kya-header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ─── Controls ──────────────────────────────────────────────────── */
.kya-controls {
  background: #fff; border-bottom: 1px solid #dde2ea;
  padding: 12px 32px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
}
.kya-controls label { font-size: 13px; font-weight: 600; color: var(--kya-navy); }
.kya-controls select, .kya-controls input {
  border: 1px solid #c9d3df; border-radius: 6px; padding: 6px 12px; font-size: 13px;
  background: #f8fafc; color: var(--kya-navy);
}
.kya-search { flex: 1; min-width: 180px; max-width: 300px; }

/* ─── KPI Cards ─────────────────────────────────────────────────── */
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; padding: 24px 32px 8px; }
.kpi-card {
  background: #fff; border-radius: var(--radius); padding: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,.07); border-left: 4px solid var(--kya-blue);
  transition: transform .15s;
}
.kpi-card:hover { transform: translateY(-2px); }
.kpi-card.pending { border-color: var(--kya-orange); }
.kpi-card.approved { border-color: var(--kya-green); }
.kpi-card.rejected { border-color: var(--kya-red); }
.kpi-card.total { border-color: var(--kya-blue); }
.kpi-value { font-size: 2rem; font-weight: 800; line-height: 1; }
.kpi-label { font-size: 12px; color: #64748b; margin-top: 4px; text-transform: uppercase; letter-spacing: .5px; }

/* ─── Module Tabs ───────────────────────────────────────────────── */
.kya-nav { padding: 8px 32px 0; background: #fff; border-bottom: 2px solid #e2e8f0; }
.kya-nav .nav-tabs { border: none; gap: 4px; }
.kya-nav .nav-link { font-weight: 600; font-size: 13px; color: #64748b; border: none; border-radius: 8px 8px 0 0; padding: 10px 18px; }
.kya-nav .nav-link.active { background: var(--kya-blue); color: #fff; }
.kya-nav .nav-link:hover:not(.active) { background: #f1f5f9; color: var(--kya-navy); }

/* ─── Content ───────────────────────────────────────────────────── */
.kya-content { padding: 24px 32px; }

/* ─── Module Panel ──────────────────────────────────────────────── */
.mod-panel {
  background: #fff; border-radius: var(--radius);
  box-shadow: 0 2px 8px rgba(0,0,0,.07); margin-bottom: 24px; overflow: hidden;
}
.mod-header {
  display: flex; align-items: center; gap: 12px; padding: 16px 20px;
  border-bottom: 1px solid #e2e8f0; background: #f8fafc;
}
.mod-icon { font-size: 1.6rem; }
.mod-title { font-weight: 700; font-size: 1rem; }
.mod-sub { font-size: 12px; color: #64748b; }
.mod-badge { margin-left: auto; background: var(--kya-blue); color: #fff; border-radius: 20px; padding: 3px 12px; font-size: 12px; font-weight: 700; }

/* ─── DocType Sub-Cards ─────────────────────────────────────────── */
.dt-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0; }
.dt-card { padding: 16px 20px; border-right: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; }
.dt-card:last-child { border-right: none; }
.dt-name { font-weight: 700; font-size: 13px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.dt-name a { color: var(--kya-blue); font-size: 11px; font-weight: 600; text-decoration: none; margin-left: auto; }
.dt-name a:hover { text-decoration: underline; }
.dt-stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.dt-stat { text-align: center; background: #f8fafc; border-radius: 6px; padding: 4px 10px; min-width: 55px; }
.dt-stat-val { font-size: 1.3rem; font-weight: 800; line-height: 1; }
.dt-stat-lbl { font-size: 9px; text-transform: uppercase; color: #64748b; }
.dt-stat.s-pending .dt-stat-val { color: var(--kya-orange); }
.dt-stat.s-approved .dt-stat-val { color: var(--kya-green); }
.dt-stat.s-rejected .dt-stat-val { color: var(--kya-red); }
.dt-stat.s-total .dt-stat-val { color: var(--kya-blue); }

/* ─── Panneau Réunions (rendu dédié) ───────────────────────────── */
.reu-panel { margin-top: 16px; border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; overflow: hidden; }
.reu-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 14px 18px; background: linear-gradient(135deg,#eff6ff,#f8fafc); border-bottom: 1px solid #e2e8f0; }
.reu-title { font-size: 15px; font-weight: 800; color: #0054A6; }
.reu-sub { font-size: 12px; color: #64748b; margin-top: 2px; }
.reu-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.reu-actions .btn { font-size: 11px; }
.reu-kpis { display: grid; grid-template-columns: repeat(auto-fit,minmax(96px,1fr)); gap: 10px; padding: 16px 18px; }
.reu-kpi { text-align: center; background: #f8fafc; border: 1px solid #eef2f7; border-radius: 10px; padding: 10px 6px; }
.reu-kpi-val { font-size: 1.5rem; font-weight: 800; line-height: 1; }
.reu-kpi-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .02em; color: #64748b; margin-top: 4px; }
.reu-recents { padding: 0 18px 16px; }
.reu-recents-title { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 6px; }
.reu-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.reu-table td { padding: 7px 6px; border-top: 1px solid #f1f5f9; }
.reu-table tr:first-child td { border-top: none; }
.reu-table a { color: var(--kya-blue); font-weight: 600; text-decoration: none; }
.reu-table a:hover { text-decoration: underline; }

/* ─── Recent Records mini-list ──────────────────────────────────── */
.dt-recents { margin-top: 8px; }
.dt-rec-row {
  display: flex; align-items: center; gap: 8px; padding: 5px 0;
  border-top: 1px solid #f1f5f9; font-size: 12px;
}
.dt-rec-row:first-child { border-top: none; }
.dt-rec-name { font-weight: 600; color: var(--kya-blue); text-decoration: none; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dt-rec-name:hover { text-decoration: underline; }
.dt-rec-date { color: #94a3b8; font-size: 11px; }
.status-badge {
  font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 700; white-space: nowrap;
}
.status-badge.pending  { background: #fff3e0; color: #e65100; }
.status-badge.approved { background: #e8f5e9; color: #2e7d32; }
.status-badge.rejected { background: #ffebee; color: #c62828; }
.status-badge.draft    { background: #eeeeee; color: #616161; }
.status-badge.other    { background: #e3f2fd; color: #1565c0; }

/* ─── Charts ────────────────────────────────────────────────────── */
.chart-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; padding: 16px 20px; border-top: 1px solid #e2e8f0; }
.chart-wrap { position: relative; height: 180px; }

/* ─── Buttons ───────────────────────────────────────────────────── */
.btn-kya-primary   { background: var(--kya-blue);   color: #fff; border: none; border-radius: 8px; padding: 8px 18px; font-weight: 600; font-size: 13px; cursor: pointer; }
.btn-kya-primary:hover { background: #003d7a; }
.btn-kya-success   { background: var(--kya-green);  color: #fff; border: none; border-radius: 8px; padding: 8px 18px; font-weight: 600; font-size: 13px; cursor: pointer; }
.btn-kya-success:hover { background: #1b5e20; }
.btn-kya-outline   { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,.4); border-radius: 8px; padding: 8px 16px; font-weight: 600; font-size: 13px; cursor: pointer; }
.btn-kya-outline:hover { border-color: #fff; background: rgba(255,255,255,.15); }

/* ─── Loading overlay ───────────────────────────────────────────── */
.kya-loader {
  position: fixed; inset: 0; background: rgba(255,255,255,.85);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 9999; font-weight: 700; color: var(--kya-blue); font-size: 1rem; gap: 16px;
}
.kya-spinner { width: 48px; height: 48px; border: 5px solid #e2e8f0; border-top-color: var(--kya-blue); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── Empty ─────────────────────────────────────────────────────── */
.kya-empty { text-align: center; color: #94a3b8; padding: 32px; font-size: 14px; }

/* ─── Responsive ────────────────────────────────────────────────── */
@media (max-width: 700px) {
  .kya-header { padding: 14px 16px; flex-wrap: wrap; }
  .kpi-row, .kya-content, .kya-controls { padding-left: 16px; padding-right: 16px; }
  .dt-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- Loading -->
<div class="kya-loader" id="kya-loader">
  <div class="kya-spinner"></div>
  <span>Chargement du tableau de bord…</span>
</div>

<!-- Header -->
<div class="kya-header">
  <img src="/assets/kya_hr/images/kya_logo.png" alt="KYA" onerror="this.style.display='none'">
  <div class="kya-header-title">
    <h1>📊 Tableau de Bord Global</h1>
    <p>KYA-Energy Group — Vue de synthèse Direction Générale</p>
  </div>
  <div class="kya-header-actions">
    <button class="btn-kya-outline" onclick="refreshData()"><i class="bi bi-arrow-clockwise"></i> Rafraîchir</button>
    <button class="btn-kya-outline" onclick="syncWebForms()" title="Synchroniser tous les modules"><i class="bi bi-diagram-3"></i> Synchroniser Web Forms</button>
    <button class="btn-kya-outline" onclick="openModuleSyncDialog()" title="Synchroniser un module précis"><i class="bi bi-funnel"></i> Sync par module</button>
    <button class="btn-kya-success" onclick="exportExcel()"><i class="bi bi-file-earmark-excel"></i> Exporter le module</button>
    <a href="/app" class="btn-kya-outline"><i class="bi bi-house"></i> Bureau</a>
  </div>
</div>

<!-- Controls -->
<div class="kya-controls">
  <label>Période :</label>
  <select id="ctrl-period" onchange="refreshData()">
    <option value="30" selected>30 derniers jours</option>
    <option value="90">3 mois</option>
    <option value="180">6 mois</option>
    <option value="365">12 mois</option>
    <option value="3650">Tout</option>
  </select>
  <label>Module :</label>
  <select id="ctrl-module" onchange="refreshData()">

  </select>
  <label>Mis à jour :</label>

<!-- KPI Row -->
<div class="kpi-row" id="kpi-row">
  <div class="kpi-card total"><div class="kpi-value" id="kpi-total">—</div><div class="kpi-label">Total fiches</div></div>
  <div class="kpi-card pending"><div class="kpi-value" id="kpi-pending" style="color:var(--kya-orange)">—</div><div class="kpi-label">En attente</div></div>
  <div class="kpi-card approved"><div class="kpi-value" id="kpi-approved" style="color:var(--kya-green)">—</div><div class="kpi-label">Approuvées</div></div>
  <div class="kpi-card rejected"><div class="kpi-value" id="kpi-rejected" style="color:var(--kya-red)">—</div><div class="kpi-label">Rejetées</div></div>
</div>

<!-- Module Tabs -->
<div class="kya-nav">
  <ul class="nav nav-tabs" id="mod-tabs" role="tablist"></ul>
</div>

<!-- Content -->
<div class="kya-content">
  <div class="tab-content" id="mod-content"></div>
</div>

<!-- Vue transversale : par département / par équipe -->
<style>
  .kya-gbtn{padding:7px 16px;border:1px solid #cbd5e1;background:#fff;color:#334155;cursor:pointer;font-weight:600;font-size:.85rem;}
  .kya-gbtn:first-child{border-radius:8px 0 0 8px;}
  .kya-gbtn:last-child{border-radius:0 8px 8px 0;border-left:none;}
  .kya-gbtn.active{background:#0054A6;color:#fff;border-color:#0054A6;}
  .kya-gtable{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .kya-gtable th,.kya-gtable td{padding:10px 14px;text-align:center;border-bottom:1px solid #eef2f7;font-size:.88rem;}
  .kya-gtable thead th{background:#f1f5f9;color:#0054A6;font-weight:700;}
  .kya-gtable tbody tr:hover{background:#f8fafc;}
</style>
<div class="kya-content" id="group-section" style="margin-top:20px;">
  <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px;">
    <strong style="color:#0054A6;font-size:1.1rem;">📊 Vue transversale</strong>
    <div role="group">
      <button type="button" class="kya-gbtn active" data-g="department" onclick="setGroupBy('department')">Par département</button>
      <button type="button" class="kya-gbtn" data-g="team" onclick="setGroupBy('team')">Par équipe</button>
    </div>
  </div>
  <div id="group-table"><div class="kya-empty">Chargement…</div></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   KYA Global Dashboard — JavaScript
   ═══════════════════════════════════════════════════════════════ */
let _lastData = null;
let _charts = {};

const fmtN  = n => new Intl.NumberFormat('fr-FR').format(Math.round(n||0));
const fmtXOF= n => fmtN(n) + ' XOF';
const fmtD  = s => s ? s.slice(0,10).split('-').reverse().join('/') : '—';

function statusBadge(cls, label) {
  return `<span class="status-badge ${cls}">${label}</span>`;
}

function showLoader(v) {
  document.getElementById('kya-loader').style.display = v ? '' : 'none';
}

/* ─── API call (via fetch direct, robuste meme sans frappe.js) ─── */
let KYA_CSRF = "{{ csrf_token or '' }}";

async function refreshCsrfToken() {
  try {
    const r = await fetch('/api/method/kya_hr.api.kya_dashboard.get_fresh_csrf', {
      method: 'GET',
      credentials: 'same-origin',
      headers: { 'X-Requested-With': 'XMLHttpRequest' },
    });
    if (!r.ok) return;
    const data = await r.json();
    if (data.message && data.message.csrf_token) {
      KYA_CSRF = data.message.csrf_token;
    }
  } catch (_) {}
}

async function kyaApiCall(method, args, isWrite) {
  // Pour les POST, toujours recuperer un CSRF frais (le token de la page peut expirer)
  if (isWrite) await refreshCsrfToken();

  const url = '/api/method/' + method;
  const headers = { 'Accept': 'application/json', 'X-Requested-With': 'XMLHttpRequest' };
  if (KYA_CSRF) headers['X-Frappe-CSRF-Token'] = KYA_CSRF;
  let body = null;
  let fetchUrl = url;
  if (isWrite) {
    headers['Content-Type'] = 'application/x-www-form-urlencoded';
    body = new URLSearchParams(args || {}).toString();
  } else {
    const qs = new URLSearchParams(args || {}).toString();
    if (qs) fetchUrl = url + '?' + qs;
  }
  const resp = await fetch(fetchUrl, {
    method: isWrite ? 'POST' : 'GET',
    headers,
    body,
    credentials: 'same-origin',  // envoie le cookie sid de Frappe
  });
  if (!resp.ok) {
    let detail = '';
    try {
      const txt = await resp.text();
      const j = JSON.parse(txt);
      detail = (j.exception || j._error_message || '').toString();
      if (!detail && j._server_messages) {
        try {
          const msgs = JSON.parse(j._server_messages);
          detail = msgs.map(m => { try { return JSON.parse(m).message; } catch (_) { return m; } }).join(' | ');
        } catch (_) { detail = j._server_messages; }
      }
    } catch (_) { /* keep empty */ }
    throw new Error('HTTP ' + resp.status + (detail ? ' : ' + detail.slice(0, 250) : ''));
  }
  const data = await resp.json();
  return data.message;
}

async function fetchStats(period, mod) {
  const message = await kyaApiCall(
    'kya_hr.api.kya_dashboard.get_global_stats',
    { period, module: mod || '' },
    false
  );
  if (!message) throw new Error('Reponse vide de get_global_stats');
  return message;
}

/* ─── Render KPIs ────────────────────────────────────────────── */
function renderKPIs(totals) {
  document.getElementById('kpi-total').textContent   = fmtN(totals.total);
  document.getElementById('kpi-pending').textContent = fmtN(totals.pending);
  document.getElementById('kpi-approved').textContent= fmtN(totals.approved);
  document.getElementById('kpi-rejected').textContent= fmtN(totals.rejected);
}

function populateModuleFilter(filters) {
  const select = document.getElementById('ctrl-module');
  const current = select.value;
  const modules = (filters && filters.modules) || [];
  select.innerHTML = '<option value="">Tous les modules</option>' + modules.map(m =>
    `<option value="${m.key}">${m.label}</option>`
  ).join('');
  if ([...select.options].some(o => o.value === current)) select.value = current;
}

/* ─── Render module tabs + content ──────────────────────────── */
function renderModules(modules) {
  const tabs    = document.getElementById('mod-tabs');
  const content = document.getElementById('mod-content');

  // Destroy old charts
  Object.values(_charts).forEach(c => { try { c.destroy(); } catch(e){} });
  _charts = {};

  tabs.innerHTML = '';
  content.innerHTML = '';

  const keys = Object.keys(modules);
  if (!keys.length) {
    content.innerHTML = '<div class="kya-empty">Aucune donnée disponible pour cette période.</div>';
    return;
  }

  keys.forEach((modKey, idx) => {
    const mod = modules[modKey];
    const isFirst = idx === 0;
    const tabId = 'tab-' + modKey;
    const paneId = 'pane-' + modKey;

    // Tab
    tabs.insertAdjacentHTML('beforeend', `
      <li class="nav-item" role="presentation">
        <button class="nav-link ${isFirst ? 'active' : ''}"
          id="${tabId}" data-bs-toggle="tab" data-bs-target="#${paneId}"
          type="button" role="tab">
          ${mod.icon} ${mod.label}
          <span class="ms-2 badge rounded-pill text-bg-secondary">${fmtN(mod.totals.total)}</span>
        </button>
      </li>
    `);

    // Pane — les réunions ont un rendu dédié (renderModuleExtra), pas la carte
    // générique « Total/Attente/Approuvé/Rejeté » + camembert (inadapté aux réunions).
    const isReunions = modKey === 'reunions';
    const dtCards = isReunions ? '' : (mod.doctypes || []).map(dt => renderDtCard(modKey, dt)).join('');

    content.insertAdjacentHTML('beforeend', `
      <div class="tab-pane fade ${isFirst ? 'show active' : ''}" id="${paneId}" role="tabpanel">
        <div class="mod-panel">
          <div class="mod-header">
            <span class="mod-icon">${mod.icon}</span>
            <div>
              <div class="mod-title">${mod.label}</div>
              <div class="mod-sub">${mod.totals.total} fiches · ${mod.totals.pending} en attente · ${mod.totals.approved} approuvées
                ${mod.totals.amount > 0 ? '· ' + fmtXOF(mod.totals.amount) : ''}
              </div>
              ${renderServiceSummary(mod.services || {})}
            </div>
            <div style="margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;">
              <button class="btn btn-sm btn-outline-success" onclick="exportExcel('${modKey}')" style="font-size:11px;">
                <i class="bi bi-file-earmark-excel"></i> Exporter cette section
              </button>
              <span class="mod-badge">${fmtN(mod.totals.total)}</span>
            </div>
          </div>

          ${isReunions ? '' : `<div class="dt-grid">${dtCards}</div>`}

          ${renderModuleExtra(modKey, mod)}

          ${isReunions ? '' : `<div class="chart-row">
            ${(mod.doctypes||[]).map(dt => {
              const cId = `chart-${modKey}-${dt.name.replace(/\s+/g,'_')}`;
              return `
                <div>
                  <div style="font-size:12px;font-weight:700;color:#64748b;margin-bottom:6px;text-align:center;">${dt.label}</div>
                  <div class="chart-wrap"><canvas id="${cId}"></canvas></div>
                </div>`;
            }).join('')}
          </div>`}
        </div>
      </div>
    `);

    // Draw charts after DOM inserted
    setTimeout(() => {
      (mod.doctypes || []).forEach(dt => {
        drawDtChart(modKey, dt);
      });
    }, 100);
  });
}

function renderModuleExtra(modKey, mod) {
  if (modKey !== 'reunions') return '';
  const dt = (mod.doctypes || []).find(item => item.name === 'KYA Reunion Meeting') || {};
  const s = dt.reunion_summary || {};
  const total = fmtN(dt.total || 0);

  // Indicateurs propres aux réunions (pas de Attente/Approuvé/Rejeté de soumission)
  const kpi = (val, lbl, color) => `
    <div class="reu-kpi">
      <div class="reu-kpi-val" style="color:${color}">${fmtN(val||0)}</div>
      <div class="reu-kpi-lbl">${lbl}</div>
    </div>`;

  // Dernières réunions
  const recents = (dt.recents || []).slice(0, 6).map(r => `
    <tr>
      <td><a href="${r.pdf_url || r.desk_url || (dt.list_url + '/' + r.name)}" target="_blank" title="Ouvrir la fiche">${r.name}</a></td>
      <td>${statusBadge(r.class, r.status)}</td>
      <td style="text-align:right;color:#64748b;white-space:nowrap;">${fmtD(r.date)}</td>
    </tr>`).join('') ||
    `<tr><td colspan="3" style="text-align:center;color:#94a3b8;padding:14px;">Aucune réunion enregistrée pour le moment.</td></tr>`;

  return `
    <div class="reu-panel">
      <div class="reu-head">
        <div>
          <div class="reu-title"><i class="bi bi-calendar2-check"></i> Réunions &amp; Émargements</div>
          <div class="reu-sub">${total} réunion(s) centralisée(s)</div>
        </div>
        <div class="reu-actions">
          <a href="${dt.form_url ? dt.form_url + '/new' : '/app/kya-reunion-meeting/new'}" class="btn btn-sm btn-outline-primary"><i class="bi bi-plus-lg"></i> Nouvelle réunion</a>
          <a href="${dt.list_url || '/app/kya-reunion-meeting'}" target="_blank" class="btn btn-sm btn-outline-secondary"><i class="bi bi-list-ul"></i> Toutes</a>
          <a href="/app/kya-reunion-sync-log" target="_blank" class="btn btn-sm btn-outline-secondary"><i class="bi bi-clock-history"></i> Historique sync</a>
        </div>
      </div>
      <div class="reu-kpis">
        ${kpi(s.active, 'Actives', '#2563eb')}
        ${kpi(s.closed, 'Clôturées', '#16a34a')}
        ${kpi(s.expired, 'Expirées', '#dc2626')}
        ${kpi(s.participants, 'Participants', '#0d9488')}
        ${kpi(s.late_count, 'Retards', '#d97706')}
        ${kpi(s.late_minutes, 'Min. de retard', '#7c3aed')}
      </div>
      <div class="reu-recents">
        <div class="reu-recents-title">Dernières réunions</div>
        <table class="reu-table"><tbody>${recents}</tbody></table>
      </div>
    </div>
  `;
}

function renderServiceSummary(services) {
  const rows = Object.values(services || {});
  if (!rows.length) return '';
  return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">${rows.map(s =>
    `<span style="background:#eef2f7;border:1px solid #dbe3ed;border-radius:999px;padding:2px 9px;font-size:11px;color:#475569;">${s.label} · ${fmtN(s.total)}</span>`
  ).join('')}</div>`;
}

    <div class="dt-rec-row">
      <a href="${r.pdf_url || r.desk_url || dt.list_url + '/' + r.name}" target="_blank" class="dt-rec-name" title="Ouvrir la fiche PDF signée">${r.name}</a>
      ${statusBadge(r.class, r.status)}
      <span class="dt-rec-date">${fmtD(r.date)}</span>
      ${r.amount ? '<span style="font-size:11px;font-weight:700;color:#475569;">' + fmtXOF(r.amount) + '</span>' : ''}
      ${r.desk_url ? `<a href="${r.desk_url}" target="_blank" title="Ouvrir dans le Desk" style="color:#64748b;"><i class="bi bi-window"></i></a>` : ''}

        <div class="dt-stat s-pending"><div class="dt-stat-val">${fmtN(c.pending||0)}</div><div class="dt-stat-lbl">Attente</div></div>
        <div class="dt-stat s-approved"><div class="dt-stat-val">${fmtN(c.approved||0)}</div><div class="dt-stat-lbl">Approuvé</div></div>
        <div class="dt-stat s-rejected"><div class="dt-stat-val">${fmtN(c.rejected||0)}</div><div class="dt-stat-lbl">Rejeté</div></div>
        ${dt.total_amount > 0 ? `<div class="dt-stat"><div class="dt-stat-val" style="font-size:.9rem;color:var(--kya-purple)">${fmtXOF(dt.total_amount)}</div><div class="dt-stat-lbl">Montant</div></div>` : ''}
      </div>
      <div class="dt-recents">
        <div style="font-size:11px;color:#64748b;margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap;">
          ${dt.service_label ? `<span><i class="bi bi-building"></i> ${dt.service_label}</span>` : ''}
          ${dt.team_label ? `<span><i class="bi bi-people"></i> ${dt.team_label}</span>` : ''}
          ${dt.web_form_route ? `<a href="${dt.web_form_route}" target="_blank" style="color:var(--kya-blue);text-decoration:none;"><i class="bi bi-link-45deg"></i> Web Form</a>` : ''}
          ${dt.print_format ? `<span title="Print Format PDF"><i class="bi bi-file-earmark-pdf"></i> ${dt.print_format}</span>` : ''}
        </div>
        <div style="font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;margin-bottom:4px;">Derniers enregistrements</div>
        ${recents}
      </div>
      <div style="margin-top:10px;">
        <a href="${dt.form_url}/new" class="btn btn-sm btn-outline-primary" style="font-size:11px;">
          <i class="bi bi-plus-lg"></i> Nouveau
        </a>
        <a href="${dt.list_url}" class="btn btn-sm btn-outline-secondary ms-1" style="font-size:11px;">
          <i class="bi bi-list-ul"></i> Toutes les fiches
        </a>
      </div>

}

function drawDtChart(modKey, dt) {
  const cId = `chart-${modKey}-${dt.name.replace(/\s+/g,'_')}`;
  const canvas = document.getElementById(cId);
  if (!canvas) return;

  const c = dt.classified || {};
  const labels = ['En attente', 'Approuvé', 'Rejeté', 'Brouillon'];
  const values = [c.pending||0, c.approved||0, c.rejected||0, c.draft||0];
  const colors = ['#e65100','#2e7d32','#c62828','#9e9e9e'];

  if (values.every(v => v === 0)) {
    canvas.parentElement.innerHTML = '<div class="kya-empty" style="font-size:12px;padding:20px;">Aucune donnée</div>';
    return;
  }

  _charts[cId] = new Chart(canvas, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data: values, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { font: { size: 10 }, boxWidth: 12 } }
      }
    }
  });
}

/* ─── Export Excel ───────────────────────────────────────────── */
function getActiveModuleKey() {
  const selected = document.getElementById('ctrl-module').value;
  if (selected) return selected;
  const active = document.querySelector('#mod-tabs .nav-link.active');
  if (!active) return Object.keys((_lastData && _lastData.modules) || {})[0] || '';
  const target = active.getAttribute('data-bs-target') || '';
  return target.replace('#pane-', '');
}

function exportExcel(moduleKey) {
  if (!_lastData) return;
  const selectedKey = moduleKey || getActiveModuleKey();
  const selectedModule = selectedKey ? _lastData.modules?.[selectedKey] : null;
  if (!selectedModule) {
    alert('Sélectionnez un module à exporter.');
    return;
  }
  const wb = XLSX.utils.book_new();

  // Feuille synthèse du module actif uniquement
  const sumRows = [['Module', 'Service', 'Équipe', 'Fiche', 'Web Form', 'Print Format', 'Total', 'En attente', 'Approuvé', 'Rejeté', 'Brouillon', 'Montant (XOF)', 'Participants', 'Actives', 'Clôturées', 'Expirées', 'Retards', 'Minutes retard']];
  (selectedModule.doctypes || []).forEach(dt => {
    const c = dt.classified || {};
    const rs = dt.reunion_summary || {};
    sumRows.push([selectedModule.label, dt.service_label || '', dt.team_label || '', dt.label, dt.web_form_route || '', dt.print_format || '', dt.total, c.pending||0, c.approved||0, c.rejected||0, c.draft||0, Math.round(dt.total_amount||0), rs.participants || '', rs.active || '', rs.closed || '', rs.expired || '', rs.late_count || '', rs.late_minutes || '']);
  });
  const wsSynth = XLSX.utils.aoa_to_sheet(sumRows);
  wsSynth['!cols'] = [22,22,20,30,24,28,10,12,12,10,12,18,14,10,10,10,10,16].map(w => ({wch: w}));
  XLSX.utils.book_append_sheet(wb, wsSynth, 'Synthèse Module');

  const modRows = [['Service', 'Équipe', 'Fiche', 'Référence', 'Statut', 'Date', 'Montant (XOF)', 'PDF', 'Desk']];
  (selectedModule.doctypes || []).forEach(dt => {
    (dt.recents || []).forEach(r => {
      modRows.push([dt.service_label || '', dt.team_label || '', dt.label, r.name, r.status, r.date, r.amount ? Math.round(r.amount) : '', r.pdf_url || '', r.desk_url || '']);
    });
  });
  const wsRecords = XLSX.utils.aoa_to_sheet(modRows);
  XLSX.utils.book_append_sheet(wb, wsRecords, 'Enregistrements');

  const period = document.getElementById('ctrl-period').value;
  const today = new Date().toISOString().slice(0,10).replace(/-/g,'');
  const safeModule = (selectedModule.label || selectedKey).replace(/[^a-z0-9]+/gi, '_').replace(/^_|_$/g, '').slice(0, 40);
  XLSX.writeFile(wb, `KYA_Dashboard_${safeModule}_${today}_P${period}j.xlsx`);
}

/* ─── Main refresh ───────────────────────────────────────────── */
async function refreshData() {
  showLoader(true);
  const period = document.getElementById('ctrl-period').value;
  const mod    = document.getElementById('ctrl-module').value;
  try {
    const data = await fetchStats(period, mod);
    _lastData = data;
    populateModuleFilter(data.filters || {});
    renderKPIs(data.totals || {});
    renderModules(data.modules || {});
    refreshGrouped(period);
    document.getElementById('last-update').textContent =
      new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  } catch (err) {
    console.error('Dashboard error:', err);
    document.getElementById('mod-content').innerHTML =
      '<div class="kya-empty"><i class="bi bi-exclamation-triangle" style="font-size:2rem;color:var(--kya-red);"></i><br>Erreur de chargement. Vérifiez vos droits d\'accès.</div>';
  } finally {
    showLoader(false);
  }
}

async function syncWebForms(module) {
  showLoader(true);
  try {
    const args = { published_only: 1, include_core: 0 };
    if (module) args.module = module;
    const res = await kyaApiCall(
      'kya_hr.api.kya_dashboard.sync_dashboard_entries_from_web_forms',
      args, true
    ) || {};
    const scope = module ? `module "${module}"` : 'tous modules';
    kyaAlert(
      `Sync ${scope} OK : ${res.created || 0} créé(s), ${res.updated || 0} mis à jour, `
      + `${(res.skipped || []).length} ignoré(s) sur ${res.total_scanned || 0} scannés.`,
      'success'
    );
    await refreshData();
  } catch (err) {
    console.error('Sync error:', err);
    const msg = (err && err.message && err.message.includes('403'))
      ? 'Synchronisation refusée — droits insuffisants. Contactez l\'administrateur.'
      : 'Synchronisation échouée : ' + (err.message || err);
    kyaAlert(msg, 'error');
  } finally {
    showLoader(false);
  }
}

async function openModuleSyncDialog() {
  // Liste des modules Frappe ayant des Web Forms (endpoint custom whitelisted)
  try {
    const res = await kyaApiCall('kya_hr.api.kya_dashboard.get_syncable_modules', {}, false) || {};
    const modules = res.modules || [];
    if (!modules.length) {
      kyaAlert('Aucun Web Form publié trouvé.', 'error');
      return;
    }
    // Dialog HTML natif (pas de dependance frappe.ui)
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9998;display:flex;align-items:center;justify-content:center;';
    const dlg = document.createElement('div');
    dlg.style.cssText = 'background:white;padding:24px;border-radius:12px;min-width:340px;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,.25);';
    dlg.innerHTML = `
      <h3 style="margin:0 0 16px;color:#0054A6;">Synchroniser un module</h3>
      <label style="display:block;font-size:.85rem;color:#666;margin-bottom:6px;">Module :</label>
      <select id="kya-sync-module" style="width:100%;padding:8px;border-radius:6px;border:1px solid #ccc;font-size:.9rem;">
        ${modules.map(m => `<option value="${m}">${m}</option>`).join('')}
      </select>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px;">
        <button id="kya-sync-cancel" style="padding:8px 18px;border:1px solid #ccc;background:white;border-radius:6px;cursor:pointer;">Annuler</button>
        <button id="kya-sync-ok" style="padding:8px 18px;background:#0054A6;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:600;">Synchroniser</button>
      </div>
    `;
    overlay.appendChild(dlg);
    document.body.appendChild(overlay);
    document.getElementById('kya-sync-cancel').onclick = () => overlay.remove();
    document.getElementById('kya-sync-ok').onclick = () => {
      const mod = document.getElementById('kya-sync-module').value;
      overlay.remove();
      syncWebForms(mod);
    };
  } catch (err) {
    console.error(err);
    kyaAlert('Impossible de lister les modules : ' + (err.message || err), 'error');
  }
}

/* ─── Vue transversale (par département / par équipe) ──────────── */
let _groupBy = 'department';
let _groupData = null;

function setGroupBy(g) {
  _groupBy = g;
  renderGrouped();
}

function renderGrouped() {
  document.querySelectorAll('.kya-gbtn').forEach(b =>
    b.classList.toggle('active', b.dataset.g === _groupBy));
  const cont = document.getElementById('group-table');
  if (!cont) return;
  if (!_groupData) { cont.innerHTML = '<div class="kya-empty">Chargement…</div>'; return; }
  const list = _groupBy === 'team' ? _groupData.by_team : _groupData.by_department;
  if (!list || !list.length) {
    cont.innerHTML = '<div class="kya-empty">Aucune fiche sur la période sélectionnée.</div>';
    return;
  }
  const head = _groupBy === 'team' ? 'Équipe' : 'Département';
  const body = list.map(r => `<tr>
      <td style="text-align:left;font-weight:600;">${r.label}</td>
      <td><strong>${fmtN(r.total)}</strong></td>
      <td style="color:var(--kya-orange)">${fmtN(r.pending)}</td>
      <td style="color:var(--kya-green)">${fmtN(r.approved)}</td>
      <td style="color:var(--kya-red)">${fmtN(r.rejected)}</td>
      <td style="color:#64748b">${fmtN(r.draft)}</td>
    </tr>`).join('');
  cont.innerHTML = `<table class="kya-gtable"><thead><tr>
      <th style="text-align:left;">${head}</th><th>Total</th><th>En attente</th>
      <th>Approuvées</th><th>Rejetées</th><th>Brouillon</th>
    </tr></thead><tbody>${body}</tbody></table>`;
}

async function refreshGrouped(period) {
  try {
    _groupData = await kyaApiCall(
      'kya_hr.api.kya_dashboard.get_grouped_stats', { period, group_by: _groupBy }, false);
    renderGrouped();
  } catch (err) {
    console.warn('[KYA Dashboard] grouped stats:', err && err.message);
    const cont = document.getElementById('group-table');
    if (cont) cont.innerHTML = '<div class="kya-empty">Vue transversale indisponible.</div>';
  }
}

/* ─── Helpers UI (fallback si frappe.show_alert indisponible) ──── */
function kyaAlert(msg, type) {
  type = type || 'info';
  if (window.frappe && frappe.show_alert) {
    frappe.show_alert({ message: msg, indicator: type === 'error' ? 'red' : type === 'success' ? 'green' : 'blue' });
  } else {
    // Fallback : toast minimal injecté dans la page
    const t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;bottom:20px;right:20px;background:'
      + (type === 'error' ? '#dc2626' : type === 'success' ? '#16a34a' : '#2563eb')
      + ';color:white;padding:12px 20px;border-radius:8px;z-index:9999;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.2);';
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 4000);
  }
}

/* ─── Init ──────────────────────────────────────────────────────
   Pas de dependance frappe global : on appelle fetch() direct.
   Check session/role au demarrage pour diagnostiquer rapidement. */
async function kyaInitDashboard() {
  // Diagnostic session (silencieux si OK, alert si Guest)
  try {
    const who = await kyaApiCall('kya_hr.api.kya_dashboard.whoami_dashboard', {}, false);
    if (who) {
      console.log('[KYA Dashboard] Session :', who);
      if (who.is_guest) {
        kyaAlert("Session expiree — veuillez vous reconnecter.", 'error');
        return;
      }
      if (!who.can_manage_dashboard) {
        console.warn('[KYA Dashboard] User connecte mais sans role manager. Roles :', who.roles);
        kyaAlert(`Connecte comme ${who.user} mais role manager manquant. Roles : ${(who.roles || []).join(', ')}`, 'error');
      }
    }
  } catch (err) {
    console.warn('[KYA Dashboard] whoami a echoue (pas bloquant) :', err.message);
  }
  refreshData();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', kyaInitDashboard);
} else {
  kyaInitDashboard();
}
