{% extends "templates/web.html" %}

{% block title %}Tableau de bord Comptabilité & Finance — KYA{% endblock %}

{% block head_include %}
<script src="/assets/kya_hr/js/chart.umd.min.js"></script>
<script src="/assets/kya_hr/js/kya_kpi.js"></script>
{% endblock %}

{% block page_content %}
<style>
  .cpx * { box-sizing:border-box; }
  .cpx { --teal:#0d7377; --orange:#F58220; --green:#6fae2f; --ink:#101828; --muted:#667085; --line:#eef1f4;
         max-width:1480px; margin:0 auto; padding:14px 14px 36px; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color:var(--ink); }
  .cpx-hero { background:linear-gradient(120deg,#0d7377,#0a5d61 55%,#0e6e5a); border-radius:16px; padding:16px; box-shadow:0 6px 20px rgba(13,115,119,.20); }
  .cpx-hero h2 { margin:0 0 12px; font-size:16px; color:#fff; font-weight:700; }
  .cpx-hgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  .cpx-hcard { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18); border-radius:12px; padding:13px 15px; display:flex; flex-direction:column; gap:6px; }
  .cpx-hcard .lbl { font-size:12px; color:rgba(255,255,255,.82); }
  .cpx-hcard .val { font-size:26px; font-weight:800; color:#fff; line-height:1; }
  .cpx-hcard .un { font-size:12px; font-weight:600; color:rgba(255,255,255,.8); margin-left:5px; }
  .cpx-hcard .sub { font-size:11.5px; color:rgba(255,255,255,.72); }
  .cpx-band { display:flex; align-items:center; gap:12px; color:#fff; border-radius:14px; padding:13px 16px; margin:18px 0 12px; }
  .cpx-band .bi { width:36px; height:36px; border-radius:10px; background:rgba(255,255,255,.16); display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .cpx-band .bt { font-size:15px; font-weight:700; } .cpx-band .bs { font-size:12px; color:rgba(255,255,255,.82); }
  .cpx-band .bc { margin-left:auto; font-size:12px; font-weight:600; background:rgba(255,255,255,.18); padding:5px 11px; border-radius:20px; white-space:nowrap; }
  .cpx-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
  .cpx-card { background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 1px 2px rgba(16,24,40,.05); padding:14px; display:flex; flex-direction:column; gap:8px; }
  .cpx-card .ch { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .cpx-card .lbl { font-size:12.5px; color:var(--muted); line-height:1.35; }
  .cpx-card .val { font-size:28px; font-weight:700; color:var(--ink); line-height:1; }
  .cpx-card .un { font-size:13px; font-weight:600; color:var(--muted); margin-left:5px; }
  .cpx-card .sub { font-size:12px; color:#98a2b3; }
  .cpx-chip { width:34px; height:34px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .cpx-table { background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .cpx-scroll { overflow-x:auto; }
  .cpx-row { display:grid; gap:10px; padding:8px 16px; border-top:1px solid #f1f4f7; align-items:center; font-size:13px; }
  .cpx-row.head { border-top:none; border-bottom:1px solid #f1f4f7; }
  .cpx-row.head span { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:#98a2b3; }
  .cpx-charts { display:grid; grid-template-columns:1.5fr 1fr; gap:12px; margin-top:12px; }
  @media (max-width:760px){ .cpx-charts{ grid-template-columns:1fr; } }
  .cpx-cc { background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 1px 2px rgba(16,24,40,.05); padding:14px; }
  .cpx-cc b { font-size:13.5px; } .cpx-cwrap { position:relative; height:260px; margin-top:8px; }
  .cpx-foot { text-align:center; font-size:11.5px; color:#b0b8c1; padding:8px 0; }
</style>

<div class="cpx" id="cpx-root">
  <div style="text-align:center;color:#94a3b8;padding:40px;">Chargement du tableau de bord…</div>
</div>

<script>
const CPX_DATA = {% if overview_json %}{{ overview_json | safe }}{% else %}null{% endif %};
const CPX_ICONS = {
  coins:[['circle',{cx:8,cy:8,r:6}],['path',{d:'M18.09 10.37A6 6 0 1 1 10.34 18M7 6h1v4M16.71 13.88l.7.71-2.82 2.82'}]],
  arrowup:[['path',{d:'M12 19V5M5 12l7-7 7 7'}]],
  arrowdown:[['path',{d:'M12 5v14M19 12l-7 7-7-7'}]],
  receipt:[['path',{d:'M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1z'}],['path',{d:'M8 7h8M8 11h8M8 15h5'}]],
  filecheck:[['path',{d:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'}],['path',{d:'M14 2v6h6M9 15l2 2 4-4'}]],
  gauge:[['path',{d:'M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z'}],['path',{d:'M13.4 12.6 16 10M4 20a9 9 0 1 1 16 0z'}]],
  wallet:[['path',{d:'M21 12V7H5a2 2 0 0 1 0-4h14v4'}],['path',{d:'M3 5v14a2 2 0 0 0 2 2h16v-5'}],['path',{d:'M18 12a2 2 0 0 0 0 4h4v-4z'}]],
};
const CPX_ACCENT = { teal:{bg:'rgba(13,115,119,.10)',fg:'#0d7377'}, orange:{bg:'rgba(245,130,32,.13)',fg:'#d9700f'}, green:{bg:'rgba(141,198,63,.20)',fg:'#5f9e2b'}, red:{bg:'rgba(214,69,80,.12)',fg:'#d64550'}, slate:{bg:'#eef1f4',fg:'#667085'} };
function svg(name,color,size){ const ns='http://www.w3.org/2000/svg'; const e=document.createElementNS(ns,'svg'); const sp=CPX_ICONS[name]||CPX_ICONS.coins;
  e.setAttribute('width',size||18); e.setAttribute('height',size||18); e.setAttribute('viewBox','0 0 24 24'); e.setAttribute('fill','none');
  e.setAttribute('stroke',color); e.setAttribute('stroke-width','1.9'); e.setAttribute('stroke-linecap','round'); e.setAttribute('stroke-linejoin','round');
  sp.forEach(s=>{ const c=document.createElementNS(ns,s[0]); for(const k in s[1]) c.setAttribute(k,s[1][k]); e.appendChild(c); }); return e; }
function chip(name,accent,white){ const a=CPX_ACCENT[accent]||CPX_ACCENT.slate; const s=document.createElement('span'); s.className='cpx-chip';
  s.style.background=white?'rgba(255,255,255,.18)':a.bg; s.appendChild(svg(name,white?'#fff':a.fg,17)); return s; }
function el(t,c,h){ const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; }
function band(icon,title,sub,chipTxt,grad){ const b=el('div','cpx-band'); b.style.background=grad;
  const bi=el('span','bi'); bi.appendChild(svg(icon,'#fff',20)); b.appendChild(bi);
  const t=el('div'); t.style.cssText='display:flex;flex-direction:column;line-height:1.2;'; t.appendChild(el('span','bt',title)); t.appendChild(el('span','bs',sub)); b.appendChild(t);
  if(chipTxt) b.appendChild(el('span','bc',chipTxt)); return b; }

function render(D){
  const root=document.getElementById('cpx-root'); root.innerHTML='';
  const hero=el('div','cpx-hero'); hero.appendChild(el('h2','Tableau de bord — Comptabilité & Finance'));
  const hg=el('div','cpx-hgrid');
  (D.hero||[]).forEach(h=>{ const c=el('div','cpx-hcard'); const top=el('div'); top.style.cssText='display:flex;justify-content:space-between;align-items:flex-start;';
    top.appendChild(el('span','lbl',h.label)); top.appendChild(chip(h.icon,'teal',true)); c.appendChild(top);
    const v=el('div'); v.style.cssText='display:flex;align-items:baseline;'; v.appendChild(el('span','val',h.value));
    if(h.unit) v.appendChild(el('span','un',h.unit)); c.appendChild(v); if(h.sub) c.appendChild(el('span','sub',h.sub)); hg.appendChild(c); });
  hero.appendChild(hg); root.appendChild(hero);

  // Bandeau « À traiter en priorité » (brique partagée KYAKPI)
  if(window.KYAKPI){ const al=D.alertes||{}; KYAKPI.prio(root,{chips:[
      {icon:'🧾',count:al.br_comptable,label:'brouillard(s) chez le comptable'},
      {icon:'🏦',count:al.br_dfc,label:'chez le DFC'},
      {icon:'📄',count:al.br_autres,label:'autre(s) en attente'},
      {icon:'🪙',count:al.cheques,label:'récap. chèques à viser'}],
    href:'/app/brouillard-caisse?workflow_state=%5B%22like%22%2C%22%25En%20attente%25%22%5D',
    cta:'Ouvrir les brouillards →', okLabel:'Aucun brouillard ni récap en attente'}); }

  root.appendChild(band('coins','Trésorerie & caisse','Brouillard Caisse · État Récap Chèques',(D.solde_label?'solde '+D.solde_label:''),'linear-gradient(100deg,#0d7377,#0a5d61)'));
  const g=el('div','cpx-cards');
  (D.treso_cards||[]).forEach(c=>{ const card=el('div','cpx-card'); const ch=el('div','ch'); ch.appendChild(el('span','lbl',c.label)); ch.appendChild(chip(c.icon,c.accent)); card.appendChild(ch);
    const v=el('div'); v.style.cssText='display:flex;align-items:baseline;'; v.appendChild(el('span','val',c.value)); if(c.unit) v.appendChild(el('span','un',c.unit)); card.appendChild(v);
    if(c.sub) card.appendChild(el('span','sub',c.sub)); g.appendChild(card); });
  root.appendChild(g);

  const t1=el('div','cpx-table'); t1.style.marginTop='12px';
  const cap=el('div'); cap.style.cssText='padding:11px 16px;border-bottom:1px solid #f1f4f7;display:flex;justify-content:space-between;align-items:center;';
  cap.appendChild(el('span',null,'<b style="font-size:13.5px;">Derniers brouillards de caisse</b>')); cap.appendChild(el('span',null,'<span style="font-size:11.5px;color:#98a2b3;">récents</span>')); t1.appendChild(cap);
  const s1=el('div','cpx-scroll'); const w1=el('div'); w1.style.minWidth='640px';
  const cols='1fr 1.6fr 1fr 1fr 1.1fr';
  const h1=el('div','cpx-row head'); h1.style.gridTemplateColumns=cols; ['Date','Saisi par','Entrées','Sorties','Solde'].forEach((x,i)=>{ const sp=el('span',null,x); if(i>=2)sp.style.textAlign='right'; h1.appendChild(sp); }); w1.appendChild(h1);
  (D.brouillard_rows||[]).forEach(r=>{ const row=el('div','cpx-row'); row.style.gridTemplateColumns=cols;
    row.appendChild(el('span',null,'<span style="color:#667085;font-variant-numeric:tabular-nums;">'+(r.date||'')+'</span>'));
    row.appendChild(el('span',null,'<b>'+(r.par||'')+'</b>'));
    const en=el('span',null,'<span style="color:#2e9e5b;font-weight:600;">'+(r.entrees||'')+'</span>'); en.style.textAlign='right'; row.appendChild(en);
    const so=el('span',null,'<span style="color:#d9700f;font-weight:600;">'+(r.sorties||'')+'</span>'); so.style.textAlign='right'; row.appendChild(so);
    const sd=el('span',null,'<b>'+(r.solde||'')+'</b>'); sd.style.textAlign='right'; row.appendChild(sd); w1.appendChild(row); });
  if(!(D.brouillard_rows||[]).length) w1.appendChild(el('div','cpx-row','<span style="color:#94a3b8;padding:8px;">Aucun brouillard de caisse.</span>'));
  s1.appendChild(w1); t1.appendChild(s1); root.appendChild(t1);

  const cw=el('div','cpx-charts');
  const c1=el('div','cpx-cc'); c1.appendChild(el('b',null,'Trésorerie — entrées / sorties (6 mois, M FCFA)')); const w1c=el('div','cpx-cwrap'); const cv1=el('canvas'); cv1.id='cpxFlow'; w1c.appendChild(cv1); c1.appendChild(w1c); cw.appendChild(c1);
  const c2=el('div','cpx-cc'); c2.appendChild(el('b',null,'Documents de caisse par état')); const w2c=el('div','cpx-cwrap'); const cv2=el('canvas'); cv2.id='cpxEtat'; w2c.appendChild(cv2); c2.appendChild(w2c); cw.appendChild(c2);
  root.appendChild(cw);
  root.appendChild(el('div','cpx-foot','KYA-Energy Group · Données en temps réel de l’ERP'));
  drawCharts(D);
}

let CPX_C1=null, CPX_C2=null;
function drawCharts(D){ if(!window.Chart) return;
  Chart.defaults.font.family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"; Chart.defaults.color='#667085';
  const f=D.flux||{labels:[],entrees:[],sorties:[]};
  if(CPX_C1){try{CPX_C1.destroy();}catch(e){}}
  CPX_C1=new Chart(document.getElementById('cpxFlow'),{type:'line',data:{labels:f.labels,datasets:[
    {label:'Entrées',data:f.entrees,borderColor:'#0d7377',backgroundColor:'rgba(13,115,119,.10)',fill:true,tension:.35,borderWidth:2,pointRadius:3,pointBackgroundColor:'#0d7377'},
    {label:'Sorties',data:f.sorties,borderColor:'#F58220',backgroundColor:'rgba(245,130,32,.08)',fill:true,tension:.35,borderWidth:2,pointRadius:3,pointBackgroundColor:'#F58220'},
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:9,usePointStyle:true,padding:14}}},
    scales:{x:{grid:{display:false}},y:{grid:{color:'#f0f2f5'},ticks:{callback:v=>v+' M'}}}}});
  const e=D.doc_etats||{labels:[],data:[]};
  if(CPX_C2){try{CPX_C2.destroy();}catch(ex){}}
  CPX_C2=new Chart(document.getElementById('cpxEtat'),{type:'doughnut',data:{labels:e.labels,datasets:[{data:e.data,
    backgroundColor:['#0d7377','#F58220','#8DC63F','#0a5d61','#e6a23c','#cbd2d9','#d64550'],borderWidth:2,borderColor:'#fff'}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'58%',plugins:{legend:{position:'bottom',labels:{boxWidth:9,usePointStyle:true,padding:12}}}}});
}

(function init(){
  function go(){ if(CPX_DATA){ render(CPX_DATA); } else if(window.frappe){
    frappe.call({method:'kya_hr.www.comptabilite_dashboard.get_compta_overview'}).then(r=>{ if(r.message) render(r.message); }); } }
  if(window.Chart) go(); else { let n=0; const iv=setInterval(()=>{ if(window.Chart||n++>60){ clearInterval(iv); go(); } },100); }
})();
</script>
{% endblock %}
