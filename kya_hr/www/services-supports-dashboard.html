{% extends "templates/web.html" %}

{% block title %}Vue d'ensemble — Services Supports — KYA{% endblock %}

{% block head_include %}
<script src="/assets/kya_hr/js/chart.umd.min.js"></script>
{% endblock %}

{% block page_content %}
<style>
  .ssx * { box-sizing:border-box; }
  .ssx { --teal:#0d7377; --orange:#F58220; --green:#6fae2f; --ink:#101828; --muted:#667085; --line:#eef1f4;
         max-width:1480px; margin:0 auto; padding:14px 14px 36px; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color:var(--ink); }
  .ssx-hero { background:linear-gradient(120deg,#F58220,#e06f12 55%,#c2570a); border-radius:16px; padding:16px; box-shadow:0 6px 20px rgba(245,130,32,.22); }
  .ssx-hero h2 { margin:0 0 3px; font-size:16px; color:#fff; font-weight:700; }
  .ssx-hero .dt { margin:0 0 12px; font-size:12px; color:rgba(255,255,255,.85); text-transform:capitalize; }
  .ssx-hgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  .ssx-hcard { background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.20); border-radius:12px; padding:13px 15px; display:flex; flex-direction:column; gap:6px; }
  .ssx-hcard .lbl { font-size:12px; color:rgba(255,255,255,.85); }
  .ssx-hcard .val { font-size:26px; font-weight:800; color:#fff; line-height:1; }
  .ssx-hcard .un { font-size:12px; font-weight:600; color:rgba(255,255,255,.82); margin-left:5px; }
  .ssx-hcard .sub { font-size:11.5px; color:rgba(255,255,255,.74); }
  .ssx-band { display:flex; align-items:center; gap:12px; color:#fff; border-radius:14px; padding:13px 16px; margin:20px 0 12px; }
  .ssx-band .bi { width:36px; height:36px; border-radius:10px; background:rgba(255,255,255,.16); display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .ssx-band .bt { font-size:15px; font-weight:700; } .ssx-band .bs { font-size:12px; color:rgba(255,255,255,.82); }
  .ssx-band .bc { margin-left:auto; font-size:12px; font-weight:600; background:rgba(255,255,255,.18); padding:5px 11px; border-radius:20px; white-space:nowrap; }
  .ssx-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:12px; }
  .ssx-kc { background:#fff; border:1px solid var(--line); border-radius:13px; padding:13px 15px; box-shadow:0 1px 2px rgba(16,24,40,.05); display:flex; flex-direction:column; gap:5px; }
  .ssx-kc .top { display:flex; justify-content:space-between; align-items:flex-start; }
  .ssx-kc .lbl { font-size:12px; color:var(--muted); } .ssx-kc .ic { width:30px; height:30px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .ssx-kc .val { font-size:23px; font-weight:800; line-height:1; } .ssx-kc .un { font-size:11.5px; font-weight:600; color:var(--muted); margin-left:4px; }
  .ssx-kc .sub { font-size:11.5px; color:#98a2b3; }
  .ssx-table { background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .ssx-scroll { overflow-x:auto; }
  .ssx-row { display:grid; gap:10px; padding:8px 16px; border-top:1px solid #f1f4f7; align-items:center; font-size:13px; }
  .ssx-row.head { border-top:none; border-bottom:1px solid #f1f4f7; }
  .ssx-row.head span { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:#98a2b3; }
  .ssx-badge { display:inline-flex; align-items:center; font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:20px; white-space:nowrap; }
  .ssx-bar { flex:1; height:6px; border-radius:4px; background:#eef1f4; overflow:hidden; min-width:50px; }
  .ssx-bar > i { display:block; height:100%; border-radius:4px; }
  .ssx-charts { display:grid; grid-template-columns:1fr 1.25fr; gap:12px; margin-top:18px; }
  @media (max-width:760px){ .ssx-charts{ grid-template-columns:1fr; } }
  .ssx-cc { background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 1px 2px rgba(16,24,40,.05); padding:14px; }
  .ssx-cc b { font-size:13.5px; } .ssx-cwrap { position:relative; height:262px; margin-top:8px; }
  .ssx-foot { text-align:center; font-size:11.5px; color:#b0b8c1; padding:10px 0; }
</style>

<div class="ssx" id="ssx-root">
  <div style="text-align:center;color:#94a3b8;padding:40px;">Chargement de la vue Services Supports…</div>
</div>

<script>
const SSX_DATA = {% if overview_json %}{{ overview_json | safe }}{% else %}null{% endif %};
const SSX_ICONS = {
  users:[['path',{d:'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2'}],['circle',{cx:9,cy:7,r:4}],['path',{d:'M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75'}]],
  usercheck:[['path',{d:'M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2'}],['circle',{cx:8.5,cy:7,r:4}],['path',{d:'m17 11 2 2 4-4'}]],
  inbox:[['path',{d:'M22 12h-6l-2 3h-4l-2-3H2'}],['path',{d:'M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z'}]],
  cart:[['circle',{cx:9,cy:21,r:1}],['circle',{cx:20,cy:21,r:1}],['path',{d:'M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6'}]],
  receipt:[['path',{d:'M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1z'}],['path',{d:'M8 7h8M8 11h8M8 15h5'}]],
  coins:[['circle',{cx:8,cy:8,r:6}],['path',{d:'M18.09 10.37A6 6 0 1 1 10.34 18M7 6h1v4M16.71 13.88l.7.71-2.82 2.82'}]],
  truck:[['path',{d:'M10 17h4V5H2v12h3'}],['path',{d:'M20 17h2v-3.34a4 4 0 0 0-1.17-2.83L19 9h-5v8h1'}],['circle',{cx:7.5,cy:17.5,r:2.5}],['circle',{cx:17.5,cy:17.5,r:2.5}]],
  calendar:[['rect',{x:3,y:4,width:18,height:18,rx:2,ry:2}],['path',{d:'M16 2v4M8 2v4M3 10h18'}]],
  clock:[['circle',{cx:12,cy:12,r:10}],['path',{d:'M12 6v6l4 2'}]],
  file:[['path',{d:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'}],['path',{d:'M14 2v6h6'}]],
  filecheck:[['path',{d:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'}],['path',{d:'M14 2v6h6M9 15l2 2 4-4'}]],
  briefcase:[['rect',{x:2,y:7,width:20,height:14,rx:2,ry:2}],['path',{d:'M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16'}]],
  package:[['path',{d:'M16.5 9.4 7.5 4.21M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z'}],['path',{d:'M3.27 6.96 12 12.01l8.73-5.05M12 22.08V12'}]],
  droplet:[['path',{d:'M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z'}]],
  wrench:[['path',{d:'M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z'}]],
  arrowup:[['path',{d:'M12 19V5M5 12l7-7 7 7'}]],
  arrowdown:[['path',{d:'M12 5v14M19 12l-7 7-7-7'}]],
  layers:[['path',{d:'M12 2 2 7l10 5 10-5-10-5z'}],['path',{d:'m2 17 10 5 10-5M2 12l10 5 10-5'}]],
};
const SSX_ACCENT = { teal:'#0d7377', orange:'#F58220', green:'#6fae2f', slate:'#667085', wait:'#0d7377', warn:'#c76a10', ok:'#5f9e2b', bad:'#d64550' };
const SSX_BADGE = { ok:{bg:'rgba(141,198,63,.20)',fg:'#5f9e2b'}, warn:{bg:'#fff4ea',fg:'#c76a10'}, wait:{bg:'rgba(13,115,119,.10)',fg:'#0d7377'}, bad:{bg:'rgba(214,69,80,.12)',fg:'#d64550'}, teal:{bg:'rgba(13,115,119,.10)',fg:'#0d7377'}, slate:{bg:'#eef1f4',fg:'#667085'} };
function svg(name,color,size){ const ns='http://www.w3.org/2000/svg'; const e=document.createElementNS(ns,'svg'); const sp=SSX_ICONS[name]||SSX_ICONS.layers;
  e.setAttribute('width',size||18); e.setAttribute('height',size||18); e.setAttribute('viewBox','0 0 24 24'); e.setAttribute('fill','none');
  e.setAttribute('stroke',color); e.setAttribute('stroke-width','1.9'); e.setAttribute('stroke-linecap','round'); e.setAttribute('stroke-linejoin','round');
  sp.forEach(s=>{ const c=document.createElementNS(ns,s[0]); for(const k in s[1]) c.setAttribute(k,s[1][k]); e.appendChild(c); }); return e; }
function el(t,c,h){ const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; }
function chipW(name){ const s=el('span'); s.style.cssText='width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.18);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;'; s.appendChild(svg(name,'#fff',17)); return s; }
function band(icon,title,sub,chipTxt,grad){ const b=el('div','ssx-band'); b.style.background=grad;
  const bi=el('span','bi'); bi.appendChild(svg(icon,'#fff',20)); b.appendChild(bi);
  const t=el('div'); t.style.cssText='display:flex;flex-direction:column;line-height:1.2;'; t.appendChild(el('span','bt',title)); t.appendChild(el('span','bs',sub)); b.appendChild(t);
  if(chipTxt) b.appendChild(el('span','bc',chipTxt)); return b; }
function badge(txt,accent){ const b=SSX_BADGE[accent]||SSX_BADGE.slate; const bd=el('span','ssx-badge'); bd.style.background=b.bg; bd.style.color=b.fg; bd.textContent=txt; const sp=el('span'); sp.appendChild(bd); return sp; }
function kcards(list){ const g=el('div','ssx-kpis'); (list||[]).forEach(k=>{ const c=el('div','ssx-kc');
    const top=el('div','top'); top.appendChild(el('span','lbl',k.label)); const ic=el('span','ic'); ic.style.background=(SSX_ACCENT[k.accent]||'#667085')+'1f'; ic.appendChild(svg(k.icon,SSX_ACCENT[k.accent]||'#667085',16)); top.appendChild(ic); c.appendChild(top);
    const v=el('div'); v.style.cssText='display:flex;align-items:baseline;'; v.appendChild(el('span','val',k.value)); if(k.unit) v.appendChild(el('span','un',k.unit)); c.appendChild(v);
    if(k.sub) c.appendChild(el('span','sub',k.sub)); g.appendChild(c); }); return g; }
function table(minw,cols,heads,rows,builder,empty){ const t=el('div','ssx-table'); const s=el('div','ssx-scroll'); const w=el('div'); w.style.minWidth=minw;
  const h=el('div','ssx-row head'); h.style.gridTemplateColumns=cols; heads.forEach(x=>h.appendChild(el('span',null,x))); w.appendChild(h);
  if(!rows||!rows.length){ w.appendChild(el('div','ssx-row','<span style="color:#94a3b8;padding:8px;">'+empty+'</span>')); }
  else rows.forEach(r=>{ const row=el('div','ssx-row'); row.style.gridTemplateColumns=cols; builder(row,r); w.appendChild(row); });
  s.appendChild(w); t.appendChild(s); return t; }
function cell(html){ return el('span',null,html); }
function muted(v){ return '<span style="color:#667085;">'+(v||'')+'</span>'; }
function num(v){ return '<span style="color:#667085;font-variant-numeric:tabular-nums;">'+(v||'')+'</span>'; }

function render(D){
  const root=document.getElementById('ssx-root'); root.innerHTML='';
  const hero=el('div','ssx-hero'); hero.appendChild(el('h2','Vue d’ensemble — Services Supports'));
  hero.appendChild(el('p','dt',(D.date_str||'')));
  const hg=el('div','ssx-hgrid');
  (D.hero||[]).forEach(h=>{ const c=el('div','ssx-hcard'); const top=el('div'); top.style.cssText='display:flex;justify-content:space-between;align-items:flex-start;';
    top.appendChild(el('span','lbl',h.label)); top.appendChild(chipW(h.icon)); c.appendChild(top);
    const v=el('div'); v.style.cssText='display:flex;align-items:baseline;'; v.appendChild(el('span','val',h.value));
    if(h.unit) v.appendChild(el('span','un',h.unit)); c.appendChild(v); if(h.sub) c.appendChild(el('span','sub',h.sub)); hg.appendChild(c); });
  hero.appendChild(hg); root.appendChild(hero);

  const GT='linear-gradient(100deg,#0d7377,#0a5d61)', GO='linear-gradient(100deg,#F58220,#e06f12)';

  // ── RESSOURCES HUMAINES ──
  root.appendChild(band('users','Ressources Humaines','effectif · présence · congés · permissions',(D.rh_label||''),GT));
  root.appendChild(kcards(D.rh&&D.rh.cards));
  root.appendChild(table('640px','1.8fr 1.5fr 90px 90px 1.6fr',
    ['Équipe','Chef','Effectif','Présents','Charge'],(D.rh&&D.rh.teams),
    (row,r)=>{ row.appendChild(cell('<b>'+(r.equipe||'')+'</b>')); row.appendChild(cell(muted(r.chef)));
      const e1=cell(num(r.eff)); e1.style.textAlign='center'; row.appendChild(e1);
      const e2=cell(num(r.pres)); e2.style.textAlign='center'; row.appendChild(e2);
      const cw=el('span'); cw.style.cssText='display:flex;align-items:center;gap:9px;'; const bar=el('div','ssx-bar'); const i=el('i'); i.style.width=r.charge+'%'; i.style.background=r.charge>=80?'#F58220':(r.charge>=50?'#0d7377':'#8DC63F'); bar.appendChild(i);
      cw.appendChild(bar); cw.appendChild(el('span',null,'<span style="font-size:12px;font-weight:600;color:#667085;">'+r.charge+'%</span>')); row.appendChild(cw); },
    'Aucune équipe support active.'));

  // ── COMPTABILITÉ & FINANCE ──
  root.appendChild(band('coins','Comptabilité & Finance','trésorerie caisse · brouillards',(D.compta_label||''),GO));
  root.appendChild(kcards(D.compta&&D.compta.cards));
  root.appendChild(table('820px','1.1fr 0.9fr 1.5fr 1fr 1fr 1fr 1.1fr',
    ['Réf.','Date','Saisi par','Entrées','Sorties','Solde','État'],(D.compta&&D.compta.rows),
    (row,r)=>{ row.appendChild(cell(num(r.ref))); row.appendChild(cell(num(r.date))); row.appendChild(cell('<b>'+(r.saisi_par||'')+'</b>'));
      row.appendChild(cell(num(r.entrees))); row.appendChild(cell(num(r.sorties))); row.appendChild(cell(num(r.solde))); row.appendChild(badge(r.etat,r.accent)); },
    'Aucun brouillard de caisse récent.'));

  // ── ACHATS & APPROVISIONNEMENT ──
  root.appendChild(band('cart','Achats & Approvisionnement','demandes · bons de commande · marchés',(D.achats_label||''),GT));
  root.appendChild(kcards(D.achats&&D.achats.cards));
  root.appendChild(table('820px','1.1fr 2.2fr 1.5fr 1fr 1.2fr',
    ['Réf.','Objet','Demandeur','Montant','État'],(D.achats&&D.achats.rows),
    (row,r)=>{ row.appendChild(cell(num(r.ref))); row.appendChild(cell(muted(r.objet))); row.appendChild(cell('<b>'+(r.demandeur||'')+'</b>'));
      row.appendChild(cell(num(r.montant))); row.appendChild(badge(r.etat,r.accent)); },
    'Aucune demande d’achat en attente.'));

  // ── STOCK & LOGISTIQUE ──
  root.appendChild(band('truck','Stock & Logistique','mouvements matériel · inventaires · flotte',(D.logi_label||''),GO));
  root.appendChild(kcards(D.logistique&&D.logistique.cards));
  root.appendChild(table('700px','1.3fr 1.8fr 1.2fr 1.6fr',
    ['Immatriculation','Modèle','Statut','Chauffeur'],(D.logistique&&D.logistique.vehicules),
    (row,r)=>{ row.appendChild(cell('<b>'+(r.immat||'')+'</b>')); row.appendChild(cell(muted(r.modele)));
      row.appendChild(badge(r.statut,r.accent)); row.appendChild(cell(muted(r.chauffeur))); },
    'Aucun véhicule enregistré.'));

  // ── CHARTS ──
  const cw=el('div','ssx-charts');
  const c1=el('div','ssx-cc'); c1.appendChild(el('b',null,'Dossiers supports par état')); const w1=el('div','ssx-cwrap'); const cv1=el('canvas'); cv1.id='ssxWf'; w1.appendChild(cv1); c1.appendChild(w1); cw.appendChild(c1);
  const c2=el('div','ssx-cc'); c2.appendChild(el('b',null,'Trésorerie caisse — 6 derniers mois (M FCFA)')); const w2=el('div','ssx-cwrap'); const cv2=el('canvas'); cv2.id='ssxCaisse'; w2.appendChild(cv2); c2.appendChild(w2); cw.appendChild(c2);
  root.appendChild(cw);
  root.appendChild(el('div','ssx-foot','KYA-Energy Group · Services Supports · données en temps réel de l’ERP'));
  drawCharts(D);
}

let SSX_C1=null, SSX_C2=null;
function drawCharts(D){ if(!window.Chart) return;
  Chart.defaults.font.family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"; Chart.defaults.color='#667085';
  const wf=(D.charts&&D.charts.workflows)||{labels:[],data:[]};
  if(SSX_C1){try{SSX_C1.destroy();}catch(e){}}
  SSX_C1=new Chart(document.getElementById('ssxWf'),{type:'doughnut',data:{labels:wf.labels,datasets:[{data:wf.data,
    backgroundColor:['#0d7377','#8DC63F','#d64550','#cbd2d9'],borderWidth:2,borderColor:'#fff'}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'58%',plugins:{legend:{position:'bottom',labels:{boxWidth:9,usePointStyle:true,padding:12}}}}});
  const ca=(D.charts&&D.charts.caisse)||{labels:[],entrees:[],sorties:[]};
  if(SSX_C2){try{SSX_C2.destroy();}catch(e){}}
  SSX_C2=new Chart(document.getElementById('ssxCaisse'),{type:'bar',data:{labels:ca.labels,datasets:[
    {label:'Entrées',data:ca.entrees,backgroundColor:'#6fae2f',borderRadius:5,maxBarThickness:18},
    {label:'Sorties',data:ca.sorties,backgroundColor:'#F58220',borderRadius:5,maxBarThickness:18}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:9,usePointStyle:true,padding:12}}},
      scales:{x:{grid:{display:false}},y:{grid:{color:'#f0f2f5'},ticks:{callback:v=>v+' M'}}}}});
}

(function init(){
  function go(){ if(SSX_DATA){ render(SSX_DATA); } else if(window.frappe){
    frappe.call({method:'kya_hr.www.services_supports_dashboard.get_ss_overview'}).then(r=>{ if(r.message) render(r.message); }); } }
  if(window.Chart) go(); else { let n=0; const iv=setInterval(()=>{ if(window.Chart||n++>60){ clearInterval(iv); go(); } },100); }
})();
</script>
{% endblock %}
