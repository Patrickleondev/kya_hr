{% extends "templates/web.html" %}

{% block title %}Tableau de bord Logistique & Flotte — KYA{% endblock %}

{% block head_include %}
<script src="/assets/kya_hr/js/chart.umd.min.js"></script>
{% endblock %}

{% block page_content %}
<style>
  .lgx * { box-sizing:border-box; }
  .lgx { --teal:#0d7377; --orange:#F58220; --green:#6fae2f; --ink:#101828; --muted:#667085; --line:#eef1f4;
         max-width:1480px; margin:0 auto; padding:14px 14px 36px; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color:var(--ink); }
  .lgx-hero { background:linear-gradient(120deg,#0d7377,#0a5d61 55%,#0e6e5a); border-radius:16px; padding:16px; box-shadow:0 6px 20px rgba(13,115,119,.20); }
  .lgx-hero h2 { margin:0 0 12px; font-size:16px; color:#fff; font-weight:700; }
  .lgx-hgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  .lgx-hcard { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18); border-radius:12px; padding:13px 15px; display:flex; flex-direction:column; gap:6px; }
  .lgx-hcard .lbl { font-size:12px; color:rgba(255,255,255,.82); }
  .lgx-hcard .val { font-size:26px; font-weight:800; color:#fff; line-height:1; }
  .lgx-hcard .un { font-size:12px; font-weight:600; color:rgba(255,255,255,.8); margin-left:5px; }
  .lgx-hcard .sub { font-size:11.5px; color:rgba(255,255,255,.72); }
  .lgx-band { display:flex; align-items:center; gap:12px; color:#fff; border-radius:14px; padding:13px 16px; margin:18px 0 12px; }
  .lgx-band .bi { width:36px; height:36px; border-radius:10px; background:rgba(255,255,255,.16); display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .lgx-band .bt { font-size:15px; font-weight:700; } .lgx-band .bs { font-size:12px; color:rgba(255,255,255,.82); }
  .lgx-band .bc { margin-left:auto; font-size:12px; font-weight:600; background:rgba(255,255,255,.18); padding:5px 11px; border-radius:20px; white-space:nowrap; }
  .lgx-table { background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .lgx-scroll { overflow-x:auto; }
  .lgx-row { display:grid; gap:10px; padding:8px 16px; border-top:1px solid #f1f4f7; align-items:center; font-size:13px; }
  .lgx-row.head { border-top:none; border-bottom:1px solid #f1f4f7; }
  .lgx-row.head span { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:#98a2b3; }
  .lgx-badge { display:inline-flex; align-items:center; font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:20px; white-space:nowrap; }
  .lgx-charts { display:grid; grid-template-columns:1fr 1.2fr; gap:12px; margin-top:18px; }
  @media (max-width:760px){ .lgx-charts{ grid-template-columns:1fr; } }
  .lgx-cc { background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 1px 2px rgba(16,24,40,.05); padding:14px; }
  .lgx-cc b { font-size:13.5px; } .lgx-cwrap { position:relative; height:260px; margin-top:8px; }
  .lgx-foot { text-align:center; font-size:11.5px; color:#b0b8c1; padding:8px 0; }
</style>

<div class="lgx" id="lgx-root">
  <div style="text-align:center;color:#94a3b8;padding:40px;">Chargement du tableau de bord…</div>
</div>

<script>
const LGX_DATA = {% if overview_json %}{{ overview_json | safe }}{% else %}null{% endif %};
const LGX_ICONS = {
  truck:[['rect',{x:1,y:3,width:15,height:13,rx:1}],['path',{d:'M16 8h4l3 3v5h-7V8z'}],['circle',{cx:5.5,cy:18.5,r:2.5}],['circle',{cx:18.5,cy:18.5,r:2.5}]],
  route:[['circle',{cx:6,cy:19,r:3}],['path',{d:'M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15'}],['circle',{cx:18,cy:5,r:3}]],
  fuel:[['path',{d:'M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18'}],['path',{d:'M3 22h12'}],['path',{d:'M14 9h3a2 2 0 0 1 2 2v6a2 2 0 0 0 4 0V8l-4-4'}],['path',{d:'M7 8h4'}]],
  wrench:[['path',{d:'M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z'}]],
  calendar:[['rect',{x:3,y:4,width:18,height:18,rx:2}],['path',{d:'M16 2v4M8 2v4M3 10h18'}]],
  gauge:[['path',{d:'M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z'}],['path',{d:'M13.4 12.6 16 10M4 20a9 9 0 1 1 16 0z'}]],
};
const LGX_BADGE = { ok:{bg:'rgba(141,198,63,.20)',fg:'#5f9e2b'}, warn:{bg:'#fff4ea',fg:'#c76a10'}, wait:{bg:'rgba(13,115,119,.10)',fg:'#0d7377'}, bad:{bg:'rgba(214,69,80,.12)',fg:'#d64550'}, teal:{bg:'rgba(13,115,119,.10)',fg:'#0d7377'}, slate:{bg:'#eef1f4',fg:'#667085'} };
function svg(name,color,size){ const ns='http://www.w3.org/2000/svg'; const e=document.createElementNS(ns,'svg'); const sp=LGX_ICONS[name]||LGX_ICONS.truck;
  e.setAttribute('width',size||18); e.setAttribute('height',size||18); e.setAttribute('viewBox','0 0 24 24'); e.setAttribute('fill','none');
  e.setAttribute('stroke',color); e.setAttribute('stroke-width','1.9'); e.setAttribute('stroke-linecap','round'); e.setAttribute('stroke-linejoin','round');
  sp.forEach(s=>{ const c=document.createElementNS(ns,s[0]); for(const k in s[1]) c.setAttribute(k,s[1][k]); e.appendChild(c); }); return e; }
function chipW(name){ const s=document.createElement('span'); s.style.cssText='width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.18);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;'; s.appendChild(svg(name,'#fff',17)); return s; }
function el(t,c,h){ const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; }
function band(icon,title,sub,chipTxt,grad){ const b=el('div','lgx-band'); b.style.background=grad;
  const bi=el('span','bi'); bi.appendChild(svg(icon,'#fff',20)); b.appendChild(bi);
  const t=el('div'); t.style.cssText='display:flex;flex-direction:column;line-height:1.2;'; t.appendChild(el('span','bt',title)); t.appendChild(el('span','bs',sub)); b.appendChild(t);
  if(chipTxt) b.appendChild(el('span','bc',chipTxt)); return b; }
function table(cols,heads,rightIdx,rows,builder,empty){ const t=el('div','lgx-table'); const s=el('div','lgx-scroll'); const w=el('div'); w.style.minWidth='720px';
  const h=el('div','lgx-row head'); h.style.gridTemplateColumns=cols; heads.forEach((x,i)=>{ const sp=el('span',null,x); if(rightIdx.indexOf(i)>=0)sp.style.textAlign='right'; h.appendChild(sp); }); w.appendChild(h);
  (rows||[]).forEach(r=>{ const row=el('div','lgx-row'); row.style.gridTemplateColumns=cols; builder(row,r); w.appendChild(row); });
  if(!(rows||[]).length) w.appendChild(el('div','lgx-row','<span style="color:#94a3b8;padding:8px;">'+empty+'</span>'));
  s.appendChild(w); t.appendChild(s); return t; }
function badge(txt,accent){ const b=LGX_BADGE[accent]||LGX_BADGE.teal; const bd=el('span','lgx-badge'); bd.style.background=b.bg; bd.style.color=b.fg; bd.textContent=txt; const sp=el('span'); sp.appendChild(bd); return sp; }

function render(D){
  const root=document.getElementById('lgx-root'); root.innerHTML='';
  const hero=el('div','lgx-hero'); hero.appendChild(el('h2','Tableau de bord — Logistique & Flotte'));
  const hg=el('div','lgx-hgrid');
  (D.hero||[]).forEach(h=>{ const c=el('div','lgx-hcard'); const top=el('div'); top.style.cssText='display:flex;justify-content:space-between;align-items:flex-start;';
    top.appendChild(el('span','lbl',h.label)); top.appendChild(chipW(h.icon)); c.appendChild(top);
    const v=el('div'); v.style.cssText='display:flex;align-items:baseline;'; v.appendChild(el('span','val',h.value));
    if(h.unit) v.appendChild(el('span','un',h.unit)); c.appendChild(v); if(h.sub) c.appendChild(el('span','sub',h.sub)); hg.appendChild(c); });
  hero.appendChild(hg); root.appendChild(hero);

  root.appendChild(band('truck','Sorties véhicule en cours','source : Sortie véhicule',(D.en_mission_label||''),'linear-gradient(100deg,#0d7377,#0a5d61)'));
  root.appendChild(table('1.2fr 1.3fr 2fr 1fr 1fr 1.1fr',['Véhicule','Conducteur','Motif','Départ','Retour prévu','Statut'],[],
    D.sortie_rows,(row,r)=>{
      row.appendChild(el('span',null,'<b>'+(r.vehicule||'')+'</b>'));
      row.appendChild(el('span',null,'<span style="color:#667085;">'+(r.conducteur||'')+'</span>'));
      row.appendChild(el('span',null,'<span style="color:#667085;">'+(r.motif||'')+'</span>'));
      row.appendChild(el('span',null,'<span style="color:#667085;font-variant-numeric:tabular-nums;">'+(r.depart||'')+'</span>'));
      row.appendChild(el('span',null,'<span style="color:#667085;font-variant-numeric:tabular-nums;">'+(r.retour||'')+'</span>'));
      row.appendChild(badge(r.statut,r.accent));
    },'Aucune sortie véhicule en cours.'));

  root.appendChild(band('wrench','Entretiens planifiés','source : Entretien véhicule',(D.a_prevoir_label||''),'linear-gradient(100deg,#F58220,#e06f12)'));
  root.appendChild(table('1.2fr 1.8fr 1fr 1fr 1.2fr',['Véhicule','Type d’entretien','Échéance','Kilométrage','Statut'],[3],
    D.entretien_rows,(row,r)=>{
      row.appendChild(el('span',null,'<b>'+(r.vehicule||'')+'</b>'));
      row.appendChild(el('span',null,'<span style="color:#667085;">'+(r.type||'')+'</span>'));
      row.appendChild(el('span',null,'<span style="color:#667085;">'+(r.echeance||'')+'</span>'));
      const km=el('span',null,'<span style="color:#667085;font-variant-numeric:tabular-nums;">'+(r.km||'')+'</span>'); km.style.textAlign='right'; row.appendChild(km);
      row.appendChild(badge(r.statut,r.accent));
    },'Aucun entretien planifié.'));

  const cw=el('div','lgx-charts');
  const c1=el('div','lgx-cc'); c1.appendChild(el('b',null,'Carburant par mois (litres)')); const w1=el('div','lgx-cwrap'); const cv1=el('canvas'); cv1.id='lgxFuel'; w1.appendChild(cv1); c1.appendChild(w1); cw.appendChild(c1);
  const c2=el('div','lgx-cc'); c2.appendChild(el('b',null,'Kilométrage par véhicule (6 mois)')); const w2=el('div','lgx-cwrap'); const cv2=el('canvas'); cv2.id='lgxUtil'; w2.appendChild(cv2); c2.appendChild(w2); cw.appendChild(c2);
  root.appendChild(cw);
  root.appendChild(el('div','lgx-foot','KYA-Energy Group · Données en temps réel de l’ERP'));
  drawCharts(D);
}

let LGX_C1=null, LGX_C2=null;
function drawCharts(D){ if(!window.Chart) return;
  Chart.defaults.font.family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"; Chart.defaults.color='#667085';
  const f=D.fuel||{labels:[],data:[]};
  if(LGX_C1){try{LGX_C1.destroy();}catch(e){}}
  LGX_C1=new Chart(document.getElementById('lgxFuel'),{type:'bar',data:{labels:f.labels,datasets:[
    {label:'Litres',data:f.data,backgroundColor:'#F58220',borderRadius:5,maxBarThickness:38}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{grid:{display:false}},y:{grid:{color:'#f0f2f5'},ticks:{callback:v=>v+' L'}}}}});
  const u=D.util||{labels:[],data:[]};
  if(LGX_C2){try{LGX_C2.destroy();}catch(ex){}}
  LGX_C2=new Chart(document.getElementById('lgxUtil'),{type:'bar',data:{labels:u.labels,datasets:[
    {label:'km',data:u.data,backgroundColor:'#0d7377',borderRadius:5,maxBarThickness:24}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{grid:{color:'#f0f2f5'},ticks:{callback:v=>v+' km'}},y:{grid:{display:false}}}}});
}

(function init(){
  function go(){ if(LGX_DATA){ render(LGX_DATA); } else if(window.frappe){
    frappe.call({method:'kya_hr.www.kya_logistique_dashboard.get_logistique_overview'}).then(r=>{ if(r.message) render(r.message); }); } }
  if(window.Chart) go(); else { let n=0; const iv=setInterval(()=>{ if(window.Chart||n++>60){ clearInterval(iv); go(); } },100); }
})();
</script>
{% endblock %}
